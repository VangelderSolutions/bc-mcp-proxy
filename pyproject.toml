[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vgs-bc-mcp"
version = "0.11.0"
description = "Resilient MCP stdio proxy for Microsoft Dynamics 365 Business Central — fork of microsoft/BCTech BcMCPProxyPython with reconnect, silent token refresh, and surfaced upstream errors."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Stephane Vangelder", email = "support@vangeldersolutions.be" }
]
maintainers = [
  { name = "Vangelder Solutions", email = "support@vangeldersolutions.be" }
]
keywords = [
  "business-central",
  "dynamics-365",
  "mcp",
  "mcp-proxy",
  "copilot",
  "agent"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries :: Application Frameworks"
]
dependencies = [
  # Capped below 2.0.0: the mcp 2.x line drops the client APIs this proxy is
  # built on (mcp.client.streamable_http.streamablehttp_client and
  # mcp.shared.exceptions.McpError). The floor is the fix version for
  # SNYK-PYTHON-MCP-18016318 / SNYK-PYTHON-MCP-18016320.
  "mcp>=1.28.1,<2.0.0",
  "httpx>=0.28.0",
  "msal>=1.38.0",
  "msal-extensions>=1.3.0",
  "exceptiongroup>=1.2.0; python_version < '3.11'",
  # Security pins for transitive dependencies (Snyk-flagged CVEs).
  # See dxt/requirements.in for the per-pin Snyk advisory IDs and
  # the rationale for exact (==) pins instead of >=.
  "h11==0.16.0",
  "cryptography==50.0.1",
  "pyjwt==2.13.0",
  "python-dotenv==1.2.3",
  "python-multipart==0.0.32",
  "requests==2.34.2",
  "starlette==1.6.0",
  "urllib3==2.7.0"
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/VangelderSolutions/bc-mcp-proxy"
Repository = "https://github.com/VangelderSolutions/bc-mcp-proxy"
Issues = "https://github.com/VangelderSolutions/bc-mcp-proxy/issues"
Upstream = "https://github.com/microsoft/BCTech/tree/master/samples/BcMCPProxyPython"


[project.scripts]
vgs-bc-mcp = "bc_mcp_proxy.__main__:main"
# Legacy alias kept for drop-in compatibility with the upstream Microsoft sample.
bc-mcp-proxy = "bc_mcp_proxy.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bc_mcp_proxy*"]

