name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run tests
        run: python -m pytest -v

  audit:
    name: pip-audit (vulnerability scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Extract runtime dependencies from pyproject.toml
        run: |
          python - <<'PY' > requirements-runtime.txt
          import tomllib
          cfg = tomllib.load(open("pyproject.toml", "rb"))
          for dep in cfg["project"]["dependencies"]:
              # Strip environment markers; pip-audit handles the bare requirement.
              print(dep.split(";")[0].strip())
          PY
          cat requirements-runtime.txt

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Audit runtime dependencies
        run: pip-audit --strict --progress-spinner off --requirement requirements-runtime.txt

  bundle-resolution:
    # Resolves dxt/requirements.txt exactly the way dxt/build.{sh,ps1} vendor
    # wheels, for every ABI in the bundle matrix, without downloading anything.
    #
    # This exists because a lockfile can be perfectly installable on the CI
    # runner and still break the release: v0.5.7's first attempt failed on all
    # three platforms because rpds-py had moved to requires-python >=3.11 while
    # the bundle still vendored a cp310 wheel set (the floor is 3.11 since 0.9.2). pip-compile resolves against
    # whatever interpreter it runs on, so nothing upstream of here catches that.
    #
    # Runs on the same host OS as the matching release build, because pip
    # evaluates environment markers (sys_platform, platform_system) against the
    # host rather than --platform.
    name: .mcpb bundle resolves (${{ matrix.platform_tag }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            pip_platform: manylinux2014_x86_64
            platform_tag: linux-x86_64
          - os: macos-latest
            pip_platform: macosx_11_0_arm64
            platform_tag: darwin-arm64
          - os: windows-latest
            pip_platform: win_amd64
            platform_tag: win-amd64

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Resolve the lockfile for every bundled ABI
        shell: bash
        run: |
          failed=0
          for abi in 311 312 313 314; do
            py="3.${abi:1}"
            echo "::group::cp$abi (Python $py) / ${{ matrix.pip_platform }}"
            if python -m pip install --dry-run \
                 --target "$RUNNER_TEMP/resolve-cp$abi" \
                 --upgrade \
                 --no-compile \
                 --python-version "$py" \
                 --only-binary ':all:' \
                 --platform "${{ matrix.pip_platform }}" \
                 -r dxt/requirements.txt; then
              echo "cp$abi OK"
            else
              echo "::error::dxt/requirements.txt has no installable wheel set for Python $py on ${{ matrix.pip_platform }} — the .mcpb build for this ABI would fail at release time."
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed

  lockfile-portability:
    # Snyk's requirements.txt scanner does not evaluate environment markers: it
    # looks for every listed package in the installed environment and aborts the
    # whole scan with "Missing required packages" when one is absent. A lockfile
    # compiled on Windows carries platform-gated entries (pywin32, colorama)
    # that pip correctly skips on Linux, which is enough to break the Snyk job.
    # Compile the lockfile on Linux; this check catches it if someone doesn't.
    name: lockfile has no environment-marker pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Reject platform markers in dxt/requirements.txt
        run: |
          if grep -nE '^[^#].*;.*(sys_platform|platform_system|platform_machine|platform_release|platform_version|os_name|python_version|python_full_version|implementation_name|implementation_version)' dxt/requirements.txt; then
            echo "::error::The lines above carry environment markers (platform or python_version). Snyk ignores environment markers and will fail the Open Source scan with 'Missing required packages'. Regenerate the lockfile on Linux with the lowest supported Python (see the header of dxt/requirements.in)."
            exit 1
          fi
          echo "No environment-marker pins."
